name = "relay"
main = "src/index.js"
compatibility_date = "2024-09-01"

# Sessions + Discord-token cache. Create before deploying:
#   wrangler kv namespace create RELAY
#   wrangler kv namespace create RELAY --preview
kv_namespaces = [
  { binding = "RELAY", id = "REPLACE_WITH_KV_ID", preview_id = "REPLACE_WITH_PREVIEW_KV_ID" },
]

# One Durable Object per Discord user holds that user's long-poll + mailbox.
# KV can't hold a poll open or wake it on delivery, so this is required.
[[durable_objects.bindings]]
name = "MAILBOX"
class_name = "Mailbox"

[[migrations]]
tag = "v1"
new_classes = ["Mailbox"]
