name: Build

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        configuration:
          # - Debug
          - Release
    steps:
      - name: Set Git to use LF line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          
      - name: Check out files
        uses: actions/checkout@v4.2.0
        with:
          submodules: true
          fetch-depth: 0
          # NOTE - If LFS ever starts getting used during builds, switch this to true!
          lfs: false

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Generate project files
        run: tools/premake5 vs2022

      - name: Set up problem matching
        uses: ammaraskar/msvc-problem-matcher@master

      - name: Build ${{matrix.configuration}}
        run: msbuild /m /v:minimal /p:Configuration=${{matrix.configuration}} /p:Platform=x64 build/cb-launcher.sln

      - name: Upload ${{matrix.configuration}} binary
        id: upload-unsigned-binary
        if: github.repository_owner == 'CBServers' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        uses: actions/upload-artifact@v4.4.0
        with:
          name: ${{matrix.configuration}} Binary
          path: |
            build/bin/x64/${{matrix.configuration}}/cb-launcher.exe

      # Test-sign the dev channel with the SignPath self-signed test cert. Best-effort:
      # if signing fails the unsigned binary above is kept so the dev release still ships.
      - name: Sign cb-launcher.exe (SignPath test cert, develop only)
        id: sign
        if: matrix.configuration == 'Release' && github.repository_owner == 'CBServers' && github.event_name == 'push' && github.ref == 'refs/heads/develop'
        continue-on-error: true
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: cb-launcher
          signing-policy-slug: test-signing
          artifact-configuration-slug: initial
          github-artifact-id: ${{ steps.upload-unsigned-binary.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Replace binary artifact with signed exe (develop only)
        if: matrix.configuration == 'Release' && github.repository_owner == 'CBServers' && github.event_name == 'push' && github.ref == 'refs/heads/develop' && steps.sign.outcome == 'success'
        uses: actions/upload-artifact@v4.4.0
        with:
          name: ${{matrix.configuration}} Binary
          path: signed/cb-launcher.exe
          overwrite: true

      - name: Upload ${{matrix.configuration}} CEF artifacts
        if: matrix.configuration == 'Release' && github.repository_owner == 'CBServers' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        uses: actions/upload-artifact@v4.4.0
        with:
          name: ${{matrix.configuration}} CEF artifacts
          path: |
            build/runtime/x64/${{matrix.configuration}}/cef/*

      - name: Upload ${{matrix.configuration}} UI artifacts
        if: matrix.configuration == 'Release' && github.repository_owner == 'CBServers' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        uses: actions/upload-artifact@v4.4.0
        with:
          name: ${{matrix.configuration}} UI artifacts
          path: |
            src/launcher-ui/*

      - name: Upload ${{matrix.configuration}} Discord artifacts
        if: matrix.configuration == 'Release' && github.repository_owner == 'CBServers' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        uses: actions/upload-artifact@v4.4.0
        with:
          name: ${{matrix.configuration}} Discord artifacts
          path: |
            build/runtime/x64/${{matrix.configuration}}/discord/*

  deploy:
    name: Deploy artifacts
    needs: build
    runs-on: windows-2022
    if: github.repository_owner == 'CBServers' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - name: Set Git to use LF line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          
      - name: Download Release binaries
        uses: actions/download-artifact@v4.1.8
        with:
          name: Release Binary

      - name: Download CEF artifacts
        uses: actions/download-artifact@v4.1.8
        with:
          name: Release CEF artifacts
          path: data/cef/release

      - name: Download UI artifacts
        uses: actions/download-artifact@v4.1.8
        with:
          name: Release UI artifacts
          path: data/launcher-ui

      - name: Download Discord artifacts
        uses: actions/download-artifact@v4.1.8
        with:
          name: Release Discord artifacts
          path: data/discord

      - name: Set artifact folder name
        run: |
          if ("${{ github.ref }}" -eq "refs/heads/develop") {
            echo "ARTIFACT_FOLDER=cb-launcher-dev" >> $env:GITHUB_ENV
          } else {
            echo "ARTIFACT_FOLDER=cb-launcher" >> $env:GITHUB_ENV
          }

      - name: Clone updater
        run: |
          git lfs install
          git config --global user.name 'CBServers'
          git config --global user.email '${{ secrets.OWNER_EMAIL }}'
          $env:GIT_TERMINAL_PROMPT=0
          $env:GIT_USERNAME="CBServers"
          $env:GIT_PASSWORD="${{ secrets.REPO_PAT }}"
          git clone https://$env:GIT_USERNAME:$env:GIT_PASSWORD@github.com/CBServers/updater.git

      - name: Replace data folder and exe in updater (preserves manifest)
        run: |
          $artifactDir = ".\updater\updater\${{ env.ARTIFACT_FOLDER }}"
          if (-not (Test-Path $artifactDir)) {
            New-Item -ItemType Directory -Path $artifactDir | Out-Null
          }
          if (Test-Path "$artifactDir\data") {
            Remove-Item -Path "$artifactDir\data" -Recurse -Force
          }
          Move-Item -Path .\data -Destination "$artifactDir\data"
          Move-Item -Path .\cb-launcher.exe -Destination "$artifactDir\cb-launcher.exe" -Force

      - name: Download hashing executable
        run: |
          Invoke-WebRequest -Uri "https://github.com/CBServers/updater/releases/latest/download/update-hasher.exe" -OutFile "update-hasher.exe"

      - name: Generate hashed.json
        run: |
          $artifactDir = ".\updater\updater\${{ env.ARTIFACT_FOLDER }}"
          Move-Item -Path .\update-hasher.exe -Destination "$artifactDir\update-hasher.exe"
          Set-Location $artifactDir
          .\update-hasher.exe
          Set-Location $env:GITHUB_WORKSPACE
          Move-Item -Path "$artifactDir\hashed.json" -Destination ".\updater\updater\${{ env.ARTIFACT_FOLDER }}.json" -Force
          Remove-Item -Path "$artifactDir\update-hasher.exe" -Force

      - name: Push changes to updater
        run: |
          cd updater
          git add .
          git lfs status
          git commit -m "Update artifacts"
          git push origin main